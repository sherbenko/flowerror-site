<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FLOWERROR — Админ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue: #0900FF;
      --white: #FFFFFF;
      --bg: #F5F5F5;
      --text: #111111;
      --text-secondary: #6c6c6c;
      --border: #E0E0E0;
      --danger: #FF3B30;
      --font-logo: 'Nunito', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; border: none; font-family: inherit; }

    .hidden { display: none !important; }

    /* ===== LOGIN ===== */
    #loginScreen {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background: var(--white);
    }

    .login-logo {
      font-family: var(--font-logo);
      font-size: 28px;
      font-weight: 900;
      color: var(--blue);
    }

    .login-sub {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
      margin-bottom: 40px;
    }

    .login-form {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ===== INPUTS ===== */
    .input {
      width: 100%;
      padding: 15px 16px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-size: 16px;
      font-family: var(--font-body);
      background: var(--bg);
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    .input:focus {
      outline: none;
      border-color: var(--blue);
    }

    /* ===== BUTTONS ===== */
    .btn-primary {
      background: var(--blue);
      color: var(--white);
      font-size: 16px;
      font-weight: 600;
      padding: 16px;
      border-radius: 50px;
      transition: opacity 0.15s;
      font-family: var(--font-body);
    }

    .btn-primary:active { opacity: 0.75; }
    .btn-primary:disabled { opacity: 0.45; }

    /* ===== ERROR MSG ===== */
    .error-msg {
      background: #FFF0F0;
      color: var(--danger);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
    }

    /* ===== HEADER ===== */
    .admin-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-logo {
      font-family: var(--font-logo);
      font-size: 20px;
      font-weight: 900;
      color: var(--blue);
    }

    .btn-logout {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* ===== CONTENT ===== */
    #adminScreen {
      padding-top: 60px;
      padding-bottom: 100px;
    }

    .admin-content {
      padding: 20px 16px;
    }

    /* ===== PRODUCT LIST ===== */
    .products-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .product-row {
      background: var(--white);
      border-radius: 16px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
    }

    .product-row-img {
      width: 68px;
      height: 68px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      background: #f0f0f0;
    }

    .product-row-img-placeholder {
      width: 68px;
      height: 68px;
      border-radius: 10px;
      flex-shrink: 0;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .product-row-info {
      flex: 1;
      min-width: 0;
    }

    .product-row-name {
      font-weight: 600;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-row-desc {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .product-row-price {
      font-family: var(--font-logo);
      font-size: 18px;
      font-weight: 800;
      color: var(--blue);
      margin-top: 3px;
    }

    .product-row-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-edit {
      background: var(--blue);
      color: var(--white);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-delete {
      background: #FFF0F0;
      color: var(--danger);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
    }

    /* ===== FAB ===== */
    .fab {
      position: fixed;
      bottom: 28px;
      right: 20px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: var(--blue);
      color: var(--white);
      font-size: 30px;
      box-shadow: 0 4px 20px rgba(9,0,255,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: transform 0.15s;
    }

    .fab:active { transform: scale(0.93); }

    /* ===== MODAL ===== */
    #modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: flex;
      align-items: flex-end;
    }

    .modal-sheet {
      background: var(--white);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-height: 95dvh;
      overflow-y: auto;
      padding: 8px 20px 48px;
      -webkit-overflow-scrolling: touch;
    }

    .modal-drag-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 12px auto 20px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-title {
      font-family: var(--font-logo);
      font-size: 22px;
      font-weight: 900;
    }

    .modal-close {
      background: var(--bg);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }

    /* ===== IMAGE PREVIEW ===== */
    .img-preview-box {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 16px;
      border: 1.5px solid var(--border);
      overflow: hidden;
      margin-bottom: 8px;
      background: #f8f8f8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .upload-progress {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .upload-progress-bar {
      height: 100%;
      background: var(--blue);
      border-radius: 2px;
      transition: width 0.2s;
    }

    .img-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .img-preview-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
    }

    .img-preview-icon { font-size: 36px; }

    .img-preview-text {
      font-size: 13px;
      text-align: center;
      padding: 0 20px;
    }

    /* ===== FORM FIELDS ===== */
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .form-field { margin-bottom: 14px; }

    /* ===== LOADING ===== */
    .loading {
      display: flex;
      justify-content: center;
      padding: 60px 0;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== EMPTY ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-icon { font-size: 52px; margin-bottom: 12px; }
    .empty-text { font-size: 16px; line-height: 1.5; }

    /* ===== TOAST ===== */
    #toast {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: var(--white);
      padding: 12px 20px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 300;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="login-logo">FLOWERROR</div>
    <div class="login-sub">панель управления</div>
    <form class="login-form" id="loginForm">
      <div id="loginError" class="error-msg hidden"></div>
      <input class="input" id="loginEmail" type="email" placeholder="email" autocomplete="email" required>
      <input class="input" id="loginPassword" type="password" placeholder="пароль" autocomplete="current-password" required>
      <button class="btn-primary" id="loginBtn" type="submit">Войти</button>
    </form>
  </div>

  <!-- ADMIN SCREEN -->
  <div id="adminScreen" class="hidden">
    <header class="admin-header">
      <div class="header-logo">FLOWERROR</div>
      <button class="btn-logout" id="logoutBtn">Выйти</button>
    </header>

    <div class="admin-content">
      <div class="products-list" id="productsList">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

    <button class="fab" id="fabBtn">+</button>
  </div>

  <!-- MODAL -->
  <div id="modal" class="hidden">
    <div class="modal-sheet">
      <div class="modal-drag-handle"></div>
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Новая охапка</div>
        <button class="modal-close" id="modalCloseBtn">✕</button>
      </div>

      <div class="img-preview-box" id="imgUploadArea">
        <img id="imgPreview" class="hidden" alt="preview">
        <div class="img-preview-placeholder" id="imgPlaceholder">
          <div class="img-preview-icon">📷</div>
          <div class="img-preview-text">Нажми чтобы загрузить фото</div>
        </div>
      </div>
      <input type="file" id="imgFileInput" accept="image/*" class="hidden">

      <div id="uploadProgress" class="upload-progress hidden" style="margin-bottom:12px">
        <div class="upload-progress-bar" id="uploadProgressBar" style="width:0%"></div>
      </div>

      <div id="saveError" class="error-msg hidden" style="margin-bottom:14px"></div>

      <div class="form-field" style="margin-bottom:20px">
        <label class="form-label">Ссылка на фото</label>
        <input class="input" id="fieldImageUrl" type="url" placeholder="https://..." autocomplete="off">
      </div>

      <div class="form-field">
        <label class="form-label">Название</label>
        <input class="input" id="fieldName" type="text" placeholder="лавандовый закат">
      </div>

      <div class="form-field">
        <label class="form-label">Состав</label>
        <input class="input" id="fieldDesc" type="text" placeholder="эустома, маттиола, эвкалипт">
      </div>

      <div class="form-field">
        <label class="form-label">Цена (BYN)</label>
        <input class="input" id="fieldPrice" type="number" inputmode="numeric" placeholder="75">
      </div>

      <button class="btn-primary" id="saveBtn" style="width:100%;margin-top:8px">Сохранить</button>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script>
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const CLOUDINARY_CLOUD = 'dsivge4co';
    const CLOUDINARY_PRESET = 'h6bkhvxu';

    let editingId = null;
    let products = [];

    const $ = id => document.getElementById(id);

    // ===== AUTH =====
    auth.onAuthStateChanged(user => {
      if (user) {
        $('loginScreen').classList.add('hidden');
        $('adminScreen').classList.remove('hidden');
        loadProducts();
      } else {
        $('loginScreen').classList.remove('hidden');
        $('adminScreen').classList.add('hidden');
      }
    });

    $('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const errEl = $('loginError');
      errEl.classList.add('hidden');
      const btn = $('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Входим...';
      try {
        await auth.signInWithEmailAndPassword($('loginEmail').value, $('loginPassword').value);
      } catch {
        errEl.textContent = 'Неверный email или пароль';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Войти';
      }
    });

    $('logoutBtn').addEventListener('click', () => auth.signOut());

    // ===== LOAD PRODUCTS =====
    async function loadProducts() {
      $('productsList').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      try {
        const snap = await db.collection('products').orderBy('createdAt', 'desc').get();
        products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderProducts();
      } catch {
        $('productsList').innerHTML = '<div class="empty-state"><div class="empty-text">Ошибка загрузки. Обнови страницу.</div></div>';
      }
    }

    function renderProducts() {
      if (products.length === 0) {
        $('productsList').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🌸</div>
            <div class="empty-text">Нет охапок.<br>Нажми + чтобы добавить первую.</div>
          </div>`;
        return;
      }
      $('productsList').innerHTML = products.map(p => `
        <div class="product-row">
          ${p.imageUrl
            ? `<img class="product-row-img" src="${esc(p.imageUrl)}" alt="${esc(p.name)}">`
            : `<div class="product-row-img-placeholder">🌸</div>`
          }
          <div class="product-row-info">
            <div class="product-row-name">${esc(p.name)}</div>
            <div class="product-row-desc">${esc(p.desc)}</div>
            <div class="product-row-price">${p.price} BYN</div>
          </div>
          <div class="product-row-actions">
            <button class="btn-edit" onclick="openEditModal('${p.id}')">изм.</button>
            <button class="btn-delete" onclick="deleteProduct('${p.id}')">удал.</button>
          </div>
        </div>
      `).join('');
    }

    // ===== DELETE =====
    async function deleteProduct(id) {
      if (!confirm('Удалить охапку?')) return;
      try {
        await db.collection('products').doc(id).delete();
        products = products.filter(p => p.id !== id);
        renderProducts();
        showToast('Удалено');
      } catch {
        showToast('Ошибка удаления');
      }
    }

    // ===== MODAL =====
    $('fabBtn').addEventListener('click', () => openAddModal());
    $('modalCloseBtn').addEventListener('click', closeModal);
    $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });

    function openAddModal() {
      editingId = null;
      $('modalTitle').textContent = 'Новая охапка';
      $('fieldImageUrl').value = '';
      $('fieldName').value = '';
      $('fieldDesc').value = '';
      $('fieldPrice').value = '';
      setPreview('');
      $('saveError').classList.add('hidden');
      $('modal').classList.remove('hidden');
      setTimeout(() => $('fieldImageUrl').focus(), 300);
    }

    function openEditModal(id) {
      const p = products.find(p => p.id === id);
      if (!p) return;
      editingId = id;
      $('modalTitle').textContent = 'Редактировать';
      $('fieldImageUrl').value = p.imageUrl ?? '';
      $('fieldName').value = p.name;
      $('fieldDesc').value = p.desc;
      $('fieldPrice').value = p.price;
      setPreview(p.imageUrl);
      $('saveError').classList.add('hidden');
      $('modal').classList.remove('hidden');
    }

    function closeModal() {
      $('modal').classList.add('hidden');
    }

    function setPreview(url) {
      const preview = $('imgPreview');
      const placeholder = $('imgPlaceholder');
      if (url) {
        preview.src = url;
        preview.classList.remove('hidden');
        placeholder.classList.add('hidden');
      } else {
        preview.src = '';
        preview.classList.add('hidden');
        placeholder.classList.remove('hidden');
      }
    }

    // Live preview on URL input
    let previewTimer;
    $('fieldImageUrl').addEventListener('input', e => {
      clearTimeout(previewTimer);
      const url = e.target.value.trim();
      if (!url) { setPreview(''); return; }
      previewTimer = setTimeout(() => setPreview(url), 600);
    });

    $('imgPreview').addEventListener('error', () => setPreview(''));

    // Cloudinary upload
    $('imgUploadArea').addEventListener('click', () => $('imgFileInput').click());

    $('imgFileInput').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      $('imgFileInput').value = '';

      const errEl = $('saveError');
      const progress = $('uploadProgress');
      const bar = $('uploadProgressBar');

      errEl.classList.add('hidden');
      progress.classList.remove('hidden');
      bar.style.width = '10%';

      try {
        const compressed = await compressImage(file);
        bar.style.width = '40%';

        const formData = new FormData();
        formData.append('file', compressed);
        formData.append('upload_preset', CLOUDINARY_PRESET);

        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
          method: 'POST',
          body: formData
        });

        bar.style.width = '90%';
        const data = await res.json();

        if (!res.ok) throw new Error(data.error?.message || 'Upload failed');

        bar.style.width = '100%';
        setTimeout(() => progress.classList.add('hidden'), 400);

        $('fieldImageUrl').value = data.secure_url;
        setPreview(data.secure_url);
        showToast('Фото загружено');
      } catch (err) {
        progress.classList.add('hidden');
        errEl.textContent = 'Ошибка загрузки фото. Попробуй ещё раз.';
        errEl.classList.remove('hidden');
        console.error(err);
      }
    });

    function compressImage(file) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const max = 1200;
            const ratio = Math.min(max / img.width, max / img.height, 1);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * ratio);
            canvas.height = Math.round(img.height * ratio);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(resolve, 'image/jpeg', 0.85);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ===== SAVE =====
    $('saveBtn').addEventListener('click', async () => {
      const imageUrl = $('fieldImageUrl').value.trim();
      const name = $('fieldName').value.trim();
      const desc = $('fieldDesc').value.trim();
      const price = parseInt($('fieldPrice').value);
      const errEl = $('saveError');

      if (!name || !desc || !price || price <= 0) {
        errEl.textContent = 'Заполни все поля';
        errEl.classList.remove('hidden');
        return;
      }

      const btn = $('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Сохраняем...';
      errEl.classList.add('hidden');

      try {
        const data = { name, desc, price, imageUrl };

        if (editingId) {
          await db.collection('products').doc(editingId).update(data);
          const idx = products.findIndex(p => p.id === editingId);
          if (idx !== -1) products[idx] = { ...products[idx], ...data };
          showToast('Сохранено');
        } else {
          data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          const ref = await db.collection('products').add(data);
          products.unshift({ id: ref.id, ...data });
          showToast('Охапка добавлена');
        }

        renderProducts();
        closeModal();
      } catch (err) {
        console.error(err);
        errEl.textContent = 'Ошибка сохранения. Попробуй ещё раз.';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Сохранить';
      }
    });

    // ===== TOAST =====
    function showToast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ===== UTILS =====
    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
